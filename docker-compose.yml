services:
  # Database
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ai_debates}
    # In production, we don't expose DB port to public
    # ports:
    #   - "5432:5432"

  # Redis (Queue + PubSub)
  redis:
    image: redis:7-alpine
    restart: always
    # In production, we don't expose Redis port to public
    # ports:
    #   - "6379:6379"

  # Backend API
  api:
    build: ./backend
    restart: always
    # Production command with proxy headers
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # Worker (RQ)
  worker:
    build: ./backend
    restart: always
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # Frontend + Caddy Proxy
  frontend:
    container_name: ai-debates-frontend-1
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    restart: always
    ports:
      - "80:80"
    environment:
      - DOMAIN_NAME=:80
      - VITE_API_URL=/api
    depends_on:
      - api

volumes:
  postgres_data:
