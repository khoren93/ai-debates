[project]
name = "ai-debates-backend"
version = "0.2.0"
description = "AI Debates API and worker: orchestrates LLM debates via OpenRouter"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.0.0",
    "rq>=2.12.0",
    "httpx>=0.28.0",
    "sse-starlette>=3.4.0",
    "sqladmin>=0.31.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "greenlet>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "pyright>=1.1.400",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults
    "RUF012", # mutable class attributes (sqladmin views)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests", "migrations/env.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
